[project]
name = "daikin-nameplate"
version = "0.1.0"
description = "Private nameplate recognition and HITL dataset system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["flask>=3.1,<4", "flask-sqlalchemy>=3.1,<4", "alembic>=1.15,<2", "pydantic>=2.11,<3", "httpx>=0.28,<1", "pillow>=11,<13", "pillow-heif>=1,<2", "python-dotenv>=1,<2", "waitress>=3,<4"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1"]

[project.scripts]
nameplate = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
